
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZAWADI | Shop Smart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo"><span>Z</span> ZAWADI</div>
    <input id="search" placeholder="Search products..." oninput="renderProducts()">
    <button onclick="showCart()">🛍 Cart (<span id="count">0</span>)</button>
  </header>

  <nav>
    <button onclick="filterProducts('All')">All</button>
    <button onclick="filterProducts('Phones')">Phones</button>
    <button onclick="filterProducts('Electronics')">Electronics</button>
    <button onclick="filterProducts('Fashion')">Fashion</button>
    <button onclick="filterProducts('Home')">Home</button>
  </nav>

  <section class="hero">
    <p>WELCOME TO ZAWADI KENYA</p>
    <h1>Good finds.<br><span>Better living.</span></h1>
    <p>Discover tech, fashion and everyday essentials.</p>
    <a href="#products">SHOP NOW ↗</a>
  </section>

  <main id="products">
    <h2>Explore Our Products</h2>
    <div id="grid" class="grid"></div>
  </main>

  <section id="cart" class="cart">
    <button onclick="hideCart()">Close ✕</button>
    <h2>Your Shopping Cart</h2>
    <div id="cartItems"></div>
    <h3>Total: <span id="total">KSh 0</span></h3>
    <button onclick="checkout()">Order on WhatsApp</button>
  </section>

  <footer>© 2026 ZAWADI Kenya · Shop Smart. Live Better.</footer>
  <script src="script.js"></script>
</body>
</html>
